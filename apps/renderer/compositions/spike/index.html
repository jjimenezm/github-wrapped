    <script>
      (function () {
        // Declared defaults, so the page also opens on its own outside HyperFrames.
        const declared = JSON.parse(document.documentElement.dataset.compositionVariables);
        const defaults = Object.fromEntries(declared.map((v) => [v.id, v.default]));
        const given = window.__hyperframes?.getVariables?.() ?? {};
        const vars = { ...defaults, ...given };
        const locale = vars.locale === 'en' ? 'en' : 'es';
        const numberFormat = new Intl.NumberFormat(locale === 'en' ? 'en-US' : 'es-CL');

        const COPY = {
          es: {
            eyebrow: 'Tu año en GitHub',
            contributions: 'contribuciones',
            growth: (pct, year) => `↗ ${pct} % vs ${year}`,
            huella: 'Tu ritmo, semana a semana',
            cordillera: 'Tu año como paisaje',
            constelacion: 'Tus proyectos',
            cta: 'Crea el tuyo',
          },
          en: {
            eyebrow: 'Your year on GitHub',
            contributions: 'contributions',
            growth: (pct, year) => `↗ ${pct}% vs ${year}`,
            huella: 'Your rhythm, week by week',
            cordillera: 'Your year as a landscape',
            constelacion: 'Your projects',
            cta: 'Make yours',
          },
        }[locale];

        document.documentElement.lang = locale;
        document.querySelectorAll('[data-copy]').forEach((el) => {
          el.textContent = COPY[el.dataset.copy];
        });
        document.getElementById('intro-login').textContent = '@' + vars.login;
        document.getElementById('intro-year').textContent = String(vars.year);
        document.getElementById('footer-year').textContent = String(vars.year);
        document.getElementById('count-label').textContent = COPY.contributions;
        const pct =
          vars.previous > 0 ? Math.round((vars.contributions / vars.previous - 1) * 100) : null;
        document.getElementById('count-growth').textContent =
          pct === null ? '' : COPY.growth(pct > 0 ? '+' + pct : pct, vars.year - 1);
        document.getElementById('outro-url').textContent = vars.url;

        const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
        const scenes = [
          ['#s-intro', 0, 3.5],
          ['#s-count', 3.5, 4.5],
          ['#s-huella', 8, 6],
          ['#s-cordillera', 14, 6],
          ['#s-constelacion', 20, 6],
          ['#s-outro', 26, 4],
        ];

        // Every frame changes something, like the real video will: light, grain and progress.
        tl.fromTo('#glow', { x: 0, y: 0 }, { x: 320, y: 900, duration: 15, ease: 'sine.inOut' }, 0);
        tl.to('#glow', { x: -60, y: 260, duration: 15, ease: 'sine.inOut' }, 15);
        const bars = document.querySelectorAll('#progress i');
        scenes.forEach(([, start, duration], i) => {
          tl.to(bars[i], { scaleX: 1, duration, ease: 'none' }, start);
        });

        // Entrances, and a short exit at the end of each scene.
        scenes.forEach(([sel, start, duration]) => {
          const scene = document.querySelector(sel);
          const heads = scene.querySelectorAll('.eyebrow, .title, .chip');
          if (heads.length)
            tl.from(heads, { y: 48, autoAlpha: 0, duration: 0.9, stagger: 0.12 }, start + 0.15);
          if (sel !== '#s-outro') {
            tl.to(
              scene.children,
              { autoAlpha: 0, y: -24, duration: 0.35, ease: 'power2.in' },
              start + duration - 0.4,
            );
          }
        });

        // Count: the panel rises, the number counts up, the blob moves under the frosted glass.
        tl.from('#s-count .panel', { y: 80, autoAlpha: 0, scale: 0.96, duration: 1 }, 3.6);
        tl.fromTo(
          '#count-blob',
          { x: -180, y: -120 },
          { x: 200, y: 160, duration: 4.5, ease: 'sine.inOut' },
          3.5,
        );
        // HyperFrames seeks with suppressed events, so onUpdate never fires: a setter paints instead.
        const countEl = document.getElementById('count-value');
        let counted = 0;
        const counter = {
          get v() {
            return counted;
          },
          set v(value) {
            counted = value;
            countEl.textContent = numberFormat.format(Math.round(value));
          },
        };
        tl.fromTo(counter, { v: 0 }, { v: vars.contributions, duration: 2.4 }, 3.9);
        tl.from(
          '#count-label, #count-growth',
          { autoAlpha: 0, y: 24, duration: 0.6, stagger: 0.15 },
          5.6,
        );

        // Huella: the rings draw themselves, the piece breathes.
        const rings = document.querySelectorAll('#s-huella .art path');
        rings.forEach((p) => {
          p.setAttribute('pathLength', '1');
          p.style.strokeDasharray = '1';
        });
        tl.fromTo(
          rings,
          { strokeDashoffset: 1 },
          { strokeDashoffset: 0, duration: 2.2, stagger: 0.05, ease: 'power1.out' },
          8.4,
        );
        tl.fromTo(
          '#s-huella .art',
          { scale: 0.9, rotate: -6 },
          { scale: 1.04, rotate: 4, duration: 5.6, ease: 'sine.inOut' },
          8.2,
        );

        // Cordillera: ridges rise one after another, then a slow pan.
        const ridges = document.querySelectorAll('#s-cordillera .art svg > g > *');
        tl.from(ridges, { y: 40, autoAlpha: 0, duration: 1.2, stagger: 0.12 }, 14.5);
        tl.fromTo(
          '#s-cordillera .art',
          { x: -36, scale: 1.02 },
          { x: 36, scale: 1.08, duration: 5.6, ease: 'sine.inOut' },
          14.2,
        );

        // Constelación: stars pop in, halos twinkle a few times.
        const stars = document.querySelectorAll('#s-constelacion .art svg > g');
        const dust = document.querySelectorAll('#s-constelacion .art svg > circle');
        tl.from(dust, { autoAlpha: 0, duration: 1.2, stagger: { amount: 1.2 } }, 20.3);
        tl.from(
          stars,
          {
            scale: 0,
            autoAlpha: 0,
            transformOrigin: '50% 50%',
            duration: 0.8,
            stagger: 0.09,
            ease: 'back.out(2)',
          },
          20.6,
        );
        tl.to(
          '#s-constelacion .art [filter]',
          {
            opacity: 0.7,
            duration: 0.6,
            stagger: { each: 0.08, repeat: 3, yoyo: true },
            ease: 'sine.inOut',
          },
          22.4,
        );
        tl.fromTo(
          '#s-constelacion .art',
          { scale: 0.96 },
          { scale: 1.06, duration: 5.6, ease: 'sine.inOut' },
          20.2,
        );

        // Outro: the full card with its QR, then the link.
        tl.from('#card', { y: 120, autoAlpha: 0, scale: 0.94, duration: 1.1 }, 26.1);
        tl.from(
          '#outro-url, #outro-cta',
          { y: 32, autoAlpha: 0, duration: 0.7, stagger: 0.15 },
          26.8,
        );
        tl.to('#card', { y: -12, duration: 2.6, ease: 'sine.inOut' }, 27.3);

        tl.set({}, {}, 30);
        window.__timelines = window.__timelines || {};
        window.__timelines['spike'] = tl;
      })();
    </script>
