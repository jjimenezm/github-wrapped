<!--
  Under every scene for the whole 30 s: the cold light that never stops drifting (its path comes
  from the seed), fine grain and the footer. The story-style progress lives in the root, which
  knows every scene's slot.
-->
<template id="backdrop-template">
  <style>
    #backdrop-root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #backdrop-glow {
      position: absolute;
      left: -300px;
      top: -260px;
      width: 1400px;
      height: 1400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgb(48 78 120 / 0.55) 0%, rgb(48 78 120 / 0) 65%);
    }
    #backdrop-bounce {
      position: absolute;
      right: -420px;
      bottom: -380px;
      width: 1200px;
      height: 1200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgb(120 140 160 / 0.16) 0%, rgb(120 140 160 / 0) 65%);
    }
    #backdrop-grain {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.07'/></svg>");
    }
    #backdrop-footer {
      position: absolute;
      left: var(--gutter);
      right: var(--gutter);
      bottom: 96px;
      display: flex;
      justify-content: space-between;
      font: 500 28px/1 var(--mono);
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
  </style>

  <div
    id="backdrop-root"
    data-composition-id="backdrop"
    data-width="1080"
    data-height="1920"
    data-duration="30"
  >
    <div id="backdrop-glow" data-layout-ignore></div>
    <div id="backdrop-bounce" data-layout-ignore></div>
    <div id="backdrop-grain" data-layout-ignore></div>
    <div id="backdrop-footer">
      <span>GitHub Wrapped</span>
      <span id="backdrop-period"></span>
    </div>
  </div>

  <script>
    (() => {
      const V = window.WrapVideo;
      const D = V.data();
      const DURATION = 30;
      document.getElementById('backdrop-period').textContent = '@' + D.login + ' · ' + D.year;

      const tl = gsap.timeline({ paused: true });

      // The light wanders through three seeded points; the bounce answers it, slower.
      const random = V.random('backdrop');
      const points = [0, 1, 2].map(() => {
        return { x: 80 + random() * 380, y: 180 + random() * 980 };
      });
      tl.fromTo(
        '#backdrop-glow',
        { x: 0, y: 0 },
        { x: points[0].x, y: points[0].y, duration: 10, ease: 'gw-in-out' },
        0,
      );
      tl.to(
        '#backdrop-glow',
        { x: points[1].x, y: points[1].y, duration: 10, ease: 'gw-in-out' },
        10,
      );
      tl.to(
        '#backdrop-glow',
        { x: points[2].x, y: points[2].y, duration: 10, ease: 'gw-in-out' },
        20,
      );
      tl.fromTo(
        '#backdrop-bounce',
        { x: 0, y: 0 },
        {
          x: -120 - random() * 160,
          y: -260 - random() * 300,
          duration: DURATION,
          ease: 'gw-in-out',
        },
        0,
      );
      tl.set({}, {}, DURATION);

      V.register('backdrop', tl);
    })();
  </script>
</template>
