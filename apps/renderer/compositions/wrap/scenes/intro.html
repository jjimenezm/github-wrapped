<!-- 0–3.5 s · Who and when: the avatar, @login and how far the year goes. -->
<template id="intro-template">
  <style>
    #intro-root {
      position: absolute;
      inset: 0;
    }
    #intro-body {
      align-items: center;
      text-align: center;
      gap: 36px;
    }
    #intro-avatar {
      width: 248px;
      height: 248px;
      border-radius: 50%;
      padding: 8px;
      border: 2px solid var(--hair-strong);
      background: var(--glass);
      margin-bottom: 12px;
    }
    #intro-avatar img,
    #intro-avatar span {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: var(--ink-raised);
      font-weight: 600;
      font-size: 112px;
      color: var(--ice);
    }
    #intro-login {
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
      max-width: 936px;
      overflow-wrap: anywhere;
    }
    #intro-period {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    #intro-chip {
      padding: 18px 32px;
      border-radius: 999px;
      border: 2px solid var(--hair-strong);
      background: var(--glass);
      font: 500 32px/1 var(--mono);
      color: var(--text);
    }
    #intro-label {
      font-size: 38px;
      color: var(--text-muted);
    }
  </style>

  <div
    id="intro-root"
    data-composition-id="intro"
    data-width="1080"
    data-height="1920"
    data-duration="3.5"
  >
    <div id="intro-body" class="scene-body">
      <div id="intro-avatar"></div>
      <p id="intro-eyebrow" class="eyebrow"></p>
      <h1 id="intro-login"></h1>
      <div id="intro-period">
        <span id="intro-chip"></span>
        <span id="intro-label"></span>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const V = window.WrapVideo;
      const D = V.data();
      const DURATION = 3.5;

      const avatar = document.getElementById('intro-avatar');
      if (D.avatar) {
        const img = document.createElement('img');
        img.src = D.avatar;
        img.alt = '';
        avatar.appendChild(img);
      } else {
        const initial = document.createElement('span');
        initial.textContent = D.login.charAt(0).toUpperCase();
        avatar.appendChild(initial);
      }

      // GitHub logins run up to 39 characters: the size shrinks so it always fits one line.
      const login = document.getElementById('intro-login');
      login.textContent = '@' + D.login;
      login.style.fontSize = Math.min(120, Math.floor(936 / (0.58 * (D.login.length + 1)))) + 'px';

      document.getElementById('intro-eyebrow').textContent = D.copy.eyebrow;
      document.getElementById('intro-chip').textContent = D.periodChip;
      document.getElementById('intro-label').textContent = D.periodLabel;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        avatar,
        { autoAlpha: 0, scale: 0.9 },
        { autoAlpha: 1, scale: 1, duration: V.MOTION.reveal, ease: 'gw-out' },
        0.05,
      );
      V.enter(tl, ['#intro-eyebrow', '#intro-login', '#intro-period'], 0.25, 0.12);
      // A slow lift while it holds, so the frame never freezes.
      tl.fromTo('#intro-body', { y: 16 }, { y: -16, duration: DURATION, ease: 'gw-in-out' }, 0);
      V.exit(tl, ['#intro-avatar', '#intro-eyebrow', '#intro-login', '#intro-period'], DURATION);

      V.register('intro', tl);
    })();
  </script>
</template>
