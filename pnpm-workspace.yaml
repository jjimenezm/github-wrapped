packages:
  - apps/*
  - packages/*
  - e2e

# Native build scripts allowed to run on install (same set as saas-core).
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true

minimumReleaseAgeExclude:
  - hyperframes@0.9.16
