name: CI

on:
  pull_request:
  push:
    branches: [main]

# Public repo: the workflow token can only read. Jobs that need more ask for it explicitly.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Disposable Postgres and Redis for the integration tests (repository and render queue).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wrapped
          POSTGRES_PASSWORD: wrapped
          POSTGRES_DB: wrapped_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wrapped -d wrapped_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The whole history, so the secret scan also sees what a later commit deleted.
          fetch-depth: 0

      # A leaked key fails the build, even one removed since (it stays in the history).
      - name: Secret scan
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

      # No `version`: pnpm is taken from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      # Shared packages build first (topological order) so apps can import them.
      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      # The api end to end over HTTP, with GitHub answered from fixtures (no network, no token).
      - name: E2E tests
        run: pnpm --filter @wrapped/api test:e2e

      # The web in a real browser over the built api in fixture mode: the server-rendered public
      # page, hydration and the sign-in round trips, with GitHub stubbed.
      - name: Browser E2E tests
        run: |
          pnpm --filter @wrapped/e2e exec playwright install --with-deps chromium
          pnpm --filter @wrapped/e2e test:e2e

      - name: Browser E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

      # Repositories, the BullMQ queue and the image worker against the real services above.
      - name: Integration tests
        env:
          DATABASE_URL: postgresql://wrapped:wrapped@localhost:5432/wrapped_test
          REDIS_URL: redis://localhost:6379
        run: |
          pnpm --filter @wrapped/api exec prisma migrate deploy
          pnpm --filter @wrapped/api test:integration
          pnpm --filter @wrapped/renderer test:integration
