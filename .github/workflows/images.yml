name: Images

# Builds the three images and publishes them to GHCR. Dokploy only pulls them, so compiling never
# competes for memory with the renders on the server.
#
# - CI calls it after a green push to main: sha-<short> (immutable, what gets deployed) and main
#   (moves with the branch).
# - A release tag (v1.2.3): 1.2.3, 1.2 and latest, kept for rollbacks.
on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    outputs:
      tag:
        description: The immutable tag of the images built from this commit (sha-<short>)
        value: ${{ jobs.version.outputs.tag }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One place decides the commit tag; the deploy uses exactly this value.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - id: sha
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  image:
    name: ${{ matrix.app }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job writes, and only to this repository's packages.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, api, renderer]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A branch gets sha-<short> and its name; v1.2.3 gets 1.2.3, 1.2 and latest. A release
      # doesn't rewrite sha-<short>: the rebuild would get a new digest under the tag already
      # deployed (and the release's commit is in the image's revision label anyway).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }},enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # The server is x86; an Arm build (QEMU) would triple the time for nothing.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
